[package]
name = "bearec"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = ">=4.0, <=4.5.57", features = ["derive"] }
cpal = { git = "https://github.com/RustAudio/cpal", branch = "master" }
hound = "3.5.1"
ringbuf = "0.5.0"

[features]
jack = ["cpal/jack"]
pulseaudio = ["cpal/pulseaudio"]
pipewire = ["cpal/pipewire"]
default = []
