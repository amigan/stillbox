version: "2"
sql:
  - engine: "postgresql"
    queries: "postgres/queries"
    schema: "postgres/migrations"
    gen:
      go:
        package: "database"
        out: "../pkg/gordio/database"
        sql_package: "pgx/v5"
        query_parameter_limit: 3
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"

