version: "2"
sql:
  - engine: "postgresql"
    queries: "postgres/queries"
    schema: "postgres/migrations"
    gen:
      go:
        package: "database"
        out: "../pkg/database"
        sql_package: "pgx/v5"
        query_parameter_limit: 3
        emit_json_tags: true
        emit_interface: true
        json_tags_case_style: camel
        initialisms:
          - id
          - tgid
          - tg
          - ms
          - mime
          - mpeg
          - wav
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.int4"
            go_type: "int"
          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"
          - db_type: "pg_catalog.text"
            go_type: "string"
          - column: "talkgroups.alert_rules"
            go_type:
              import: "dynatron.me/x/stillbox/pkg/alerting/rules"
              type: "AlertRules"
            nullable: true
          - column: "talkgroups.metadata"
            go_type:
              import: "dynatron.me/x/stillbox/internal/jsontypes"
              type: "Metadata"
            nullable: true
          - column: "incidents.metadata"
            go_type:
              import: "dynatron.me/x/stillbox/internal/jsontypes"
              type: "Metadata"
            nullable: true
          - column: "pg_catalog.pg_tables.tablename"
            go_type: string
            nullable: false
