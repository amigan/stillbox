<h2 mat-dialog-title>{{ title }}</h2>
<mat-dialog-content>
  <div class="incRecord">
    @let inc = inc$ | async;
    @if (inc) {
      <form id="incForm" [formGroup]="form" (ngSubmit)="save()">
        <div>
          <mat-form-field>
            <mat-label>Name</mat-label>
            <input matInput name="name" type="text" formControlName="name" />
          </mat-form-field>
          <mat-form-field subscriptSizing="dynamic" class="timeFilterBox">
            <mat-label>Start</mat-label>
            <input
              matInput
              type="datetime-local"
              name="start"
              placeholder="Start time"
              formControlName="start"
            />
          </mat-form-field>
          <mat-form-field subscriptSizing="dynamic" class="timeFilterBox">
            <mat-label>End</mat-label>
            <input
              matInput
              type="datetime-local"
              name="end"
              placeholder="End time"
              formControlName="end"
            />
          </mat-form-field>
          <mat-form-field subscriptSizing="dynamic" class="descBox">
            <mat-label>Description</mat-label>
            <textarea
              matInput
              name="description"
              placeholder="Description"
              rows="8"
              cols="200"
              >{{ inc.description }}</textarea
            >
          </mat-form-field>
        </div>
      </form>
    } @else {
      <div class="spinner">
        <mat-spinner></mat-spinner>
      </div>
    }
  </div>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-button form="incForm" type="submit" cdkFocusInitial>Save</button>
</mat-dialog-actions>
