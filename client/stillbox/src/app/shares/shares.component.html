<div class="tabContainer" *ngIf="!isLoading; else spinner">
  <table class="sharesTable" mat-table [dataSource]="sharesResult">
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox
          (change)="$event ? masterToggle() : null"
          [checked]="selection.hasValue() && isAllSelected()"
          [indeterminate]="selection.hasValue() && !isAllSelected()"
        >
        </mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox
          (click)="$event.stopPropagation()"
          (change)="$event ? selection.toggle(row) : null"
          [checked]="selection.isSelected(row)"
        >
        </mat-checkbox>
      </td>
    </ng-container>
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let share">
        @switch (share.entityType) {
          @case ("incident") {
            <mat-icon>newspaper</mat-icon>
          }
          @case ("call") {
            <mat-icon>campaign</mat-icon>
          }
        }
      </td>
    </ng-container>
    <ng-container matColumnDef="link">
      <th mat-header-cell *matHeaderCellDef>Link</th>
      <td mat-cell *matCellDef="let share">
        <a [href]="'/s/' + share.id"><mat-icon>link</mat-icon></a>
      </td>
    </ng-container>
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let share">
        {{ share.entityDate | fmtDate }}
      </td>
    </ng-container>
    <ng-container matColumnDef="owner">
      <th mat-header-cell *matHeaderCellDef>Owner</th>
      <td mat-cell *matCellDef="let share">
        {{ share.owner }}
      </td>
    </ng-container>
    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef>Delete</th>
      <td mat-cell *matCellDef="let share">
        <a (click)="deleteShare(share.id)">
          <mat-icon>delete</mat-icon>
        </a>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
    <tr mat-row *matRowDef="let myRowData; columns: columns"></tr>
  </table>
</div>
<div class="pagFoot">
  <mat-paginator
    #paginator
    class="paginator"
    (page)="setPage($event)"
    [length]="count"
    showFirstLastButtons="true"
    [pageSize]="curPage.pageSize"
    [pageSizeOptions]="pageSizeOptions"
    [pageIndex]="curPage.pageIndex"
    aria-label="Select page"
  >
  </mat-paginator>
</div>
<ng-template #spinner>
  <div class="spinner">
    <mat-spinner></mat-spinner>
  </div>
</ng-template>
