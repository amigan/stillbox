<div class="flex">
  <form *ngIf="tg" [formGroup]="form" (ngSubmit)="submit()">
    <div class="p-1 columns-2">
      <label class="w-full" for="name">Name: </label
      ><input
        id="name"
        type="text"
        class="w-full input input-bordered"
        formControlName="name"
      />
    </div>
    <div class="p-1 columns-2">
      <label class="w-full" for="alpha_tag">Alpha Tag: </label
      ><input
        id="alpha_tag"
        type="text"
        class="w-full input input-bordered"
        formControlName="alpha_tag"
      />
    </div>
    <div class="p-1 columns-2">
      <label class="w-full" for="tg_group">Group: </label
      ><input
        id="tg_group"
        type="text"
        class="w-full input input-bordered"
        formControlName="tg_group"
      />
    </div>
    <div class="p-1 columns-2">
      <label class="w-full" for="frequency">Frequency: </label
      ><input
        id="frequency"
        type="text"
        class="w-full input input-bordered"
        formControlName="frequency"
      />
    </div>
    <div class="p-1 columns-2">
      <label class="w-full" for="alert">Alert: </label>
      <div class="w-full">
        <input
          id="alert"
          type="checkbox"
          formControlName="alert"
          class="checkbox"
        />
      </div>
    </div>
    <div class="p-1 columns-2">
      <label class="w-full" for="weight">Weight: </label
      ><input
        id="weight"
        type="text"
        class="w-full input input-bordered"
        formControlName="weight"
      />
    </div>
    <div>Rules:</div>
    <alert-rule-builder [rules]="tg.alert_config" />
    <div>
      <label for="icon">Icon: </label>
      <select class="select" name="icon" id="icon" formControlName="icon">
        @for (opt of iconMapping | keyvalue; track opt) {
          <option
            value="{{ opt.key }}"
            [selected]="opt.key == tg.metadata?.icon"
          >
            {{ opt.key | titlecase }}
          </option>
        }
      </select>
    </div>
    <input type="submit" class="btn btn-secondary" value="Save" />
  </form>
</div>
