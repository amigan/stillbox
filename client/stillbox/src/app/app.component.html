<app-update-nag></app-update-nag>
<app-error-bar></app-error-bar>
<header class="topHeader">
  <mat-toolbar>
    <div class="navbar">
      <div class="stillboxLogo">
        <a (click)="toggleNav()">Stillbox</a>
      </div>
      <div class="centerNav"></div>
      <div class="rightNav">
        @if (auth.isAuth()) {
          <mat-menu #userMenu="matMenu">
            <button mat-menu-item [routerLink]="'/profile'">Profile</button>
            <button (click)="logout()" mat-menu-item>Logout</button>
          </mat-menu>
          <a [matMenuTriggerFor]="userMenu">
            <avatar />
          </a>
        }
      </div>
    </div>
  </mat-toolbar>
</header>
<main>
  @if (auth.isAuth()) {
    <app-navigation [events]="toggleNavSubject.asObservable()"></app-navigation>
  } @else {
    <router-outlet />
  }
</main>
