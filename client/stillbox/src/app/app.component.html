<!-- ========== HEADER ========== -->
<header class="topHeader">
  <mat-toolbar>
    <div class="navbar">
      <div class="stillboxLogo">
        <a (click)="toggleNav()">Stillbox</a>
      </div>
      <div class="centerNav"></div>
      <div class="rightNav">
        @if (auth.loggedIn) {
          <button class="ybtn">
            <a (click)="logout()" class="logout">Logout</a>
          </button>
        }
      </div>
    </div>
  </mat-toolbar>
</header>

<div class="container">
  @if (auth.loggedIn) {
    <app-navigation [events]="toggleNavSubject.asObservable()"></app-navigation>
  } @else {
    <div class="content">
      <router-outlet />
    </div>
  }
</div>
