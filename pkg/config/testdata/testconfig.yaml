server:
  cors:
    allowedOrigins:
      - 'http://localhost:*'
  listen: ':3051'
  public: true
db:
  connect: 'postgres://stillbox:somepassword@stillbox:5432/stillbox?sslmode=disable'
  logQueries: true
auth:
  jwtsecret: 'somesecret'
  domain: xenon
  allowInsecureFor:
    "localhost": true
    "stillbox": true
  apiKeyACL:
    deny:
      - 6.4.3.2
    order: deny, allow
log:
  - level: debug
  - level: error
    file: error.log
alerting:
  enable: true
  lookbackDays: 7
  halfLife: 30m
  recent: 2h
  alertThreshold: 0.3
  renotify: 30m
  contextLookback: 30m
notify:
  backends:
  - provider: slackwebhook
    config:
      webhookURL: "https://hook"
relay:
  - url: "http://relay"
    apiKey: "secret"
    required: true

