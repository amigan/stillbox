syntax = "proto3";
package stillbox;
option go_package = "./pb";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

message Message {
  oneof toClient_message {
    CommandResponse response = 1;
    Call call = 2;
    CallTranscription transcription = 3;
    Notification notification = 4;
    UserPopup popup = 5;
    Error error = 6;
    Hello hello = 7;
  }
}

message CommandResponse {
  optional int64 command_id = 1;
  oneof command_response {
    TalkgroupInfo tg_info = 2;
  }
}

message Call {
  string id = 1;
  string audioName = 2;
  string audioType = 3;
  google.protobuf.Timestamp date_time = 4;
  int32 system = 5;
  int32 talkgroup = 6;
  optional string talker_alias = 7;
  int32 source = 8;
  int64 frequency = 9;
  repeated int64 frequencies = 10;
  repeated int32 patches = 11;
  optional int32 duration = 12;
  bytes audio = 13;
}

message CallTranscription {
  string id = 1;
  int32 system = 2;
  int32 talkgroup = 3;
  repeated int32 patches = 4;
  string transcript = 5;
}

message Hello {
  ServerInfo server_info = 1;
}

message UserPopup {
  string msg = 1;
}

message Error {
  string error = 1;
  Command command = 2;
}

message Notification {
  google.protobuf.Timestamp date_time = 1;
  string title = 2;
  string msg = 3;
  string action_url = 4;
}

message Command {
  optional int64 command_id = 1;
  oneof command {
    Live live_command = 2;
    Search search_command = 3;
    Talkgroup tg_command = 4;
    Register register_command = 5;
    SetTranscript set_transcript = 6;
    UploadCall upload_call = 7;
  }
}

message TalkgroupInfo {
  Talkgroup tg = 1;
  string system_name = 2;
  optional string name = 3;
  optional string group = 4;
  optional string alpha_tag = 5;
  optional int32 frequency = 6;
  repeated string tags = 7;
  optional google.protobuf.Struct metadata = 8;
  bool learned = 9;
}

enum LiveState {
  LS_STOPPED = 0;
  LS_LIVE = 1;
  LS_PAUSED = 2;
}

message Live {
  optional LiveState state = 1;
  optional Filter filter = 2;
  bool calls = 3;
  bool transcripts = 4;
}

message Register {
  bool transcript_worker = 1;
  string worker_key = 2;
}

message Talkgroup {
  int32 system = 1;
  int32 talkgroup = 2;
}

message Filter {
  repeated Talkgroup talkgroups = 1;
  repeated Talkgroup talkgroups_not = 2;
  repeated string talkgroup_tags_all = 3;
  repeated string talkgroup_tags_any = 4;
  repeated string talkgroup_tags_not = 5;
  bool all = 6;
}

message Search {
}

message ServerInfo {
  string server_name = 1;
  string version = 2;
  string built = 3;
  string platform = 4;
  string db_size = 5;
}

message SetTranscript {
  string id = 1;
  string transcript = 2;
  optional int64 elapsed_ms = 3;
}

message UploadCall {
  Call call = 1;
  optional bool dontStore = 2;
}
