    config:
      webhookURL: "http://somewhere"

# configure upstream relays here
relay:
    # `url` is the root of the instance
# - url: 'http://some.host:3051/'
#   apiKey: aaaabbbb-cccc-dddd-eeee-ffff11112222
    # `required` specifies whether we should report failure (i.e. HTTP 500 for rdio-http) to the source
    # if the relay call submission fails
#   required: false

# callStorage backends have filters tested until one matches, then that one wins for storage of new calls
# null filter always matches
# ingest specifies whether to try to store audio in this backend
# if none are configured/evaluate during ingestion, calls are simply stored as blobs in the DB
callStorage:
  # name of the backend ends up being stored in the DB and
  # should not change once chosen, otherwise every record must be
  # updated.
  - name: s3
    backend: s3
    # if this backend fails:
    # next-then-fail (default) - try next backend (including filter), if no other backends store then fail ingest
    # next-then-db - try next backend (including filter) or ultimately the DB
    # fail - fail the ingest immediately
    # db - stop processing backends, store in DB
    onError: next-then-fail
    # ingest specifies whether this is not to be used to store new calls
    # but exists to serve requests for calls referencing this backend in the DB
    ingest: true
    # filter is same as below, or can be null or unspecified
#   filter:
#     talkgroups:
#       - "197:10101"
#     talkgroupTagsAny:
#       - fire dispatch
#       - law dispatch
    config:
      bucket: 'stillbox'
      # secure is whether to use https when accessing the endpoint.
      secure: false
      # endpoint is how stillbox will access the object server
      endpoint: 'garage:3900'
      region: 'garage'
      # if externalHost is set, this host will be used to generate presigned URLs
      # for call audio redirect to clients rather than endpoint above
      externalHost: 'garage.example.com'
      # if externalHost is set, externalSecure specifies whether to use https for presigned URLs
      externalSecure: true
      # timeout is the amount of time for S3 request deadline before next action (store in DB or fail)
      timeout: 10s
      keyID: 'GK7894947fffaacacd83664923'
      secretKey: 'bacba7892843792347987293874923847293487239487234987234bababababa'
  - name: fs
    backend: fs
    config:
      # root path to store call audio in, must be a directory
      root: "/tank/stillbox"

