server:
  # this is used to compose URLs, for example in M3U responses.
  # set it to what users access the instance as.
  baseURL: "https://stillbox.example.com"
  listen: ':3050'
  public: true
  # set this to true only when using a reverse proxy that sets this header
  useXRealIP: false
  rateLimit:
    enable: true
    requests: 200
    over: 2m
  cors:
    allowedOrigins:
      - 'localhost:*'
      - 'stillbox.server'
  # if adminSocket is set/not null, it specifies a path where stillbox will
  # open a unix domain socket for local daemon control use
  adminSocket: /var/run/stillbox/stillbox.sock

db:
  connect: 'postgres://postgres:password@localhost:5432/example'
  partition:
    # whether to enable the built-in partition manager
    # note that when this is disabled, the calls table is still (by default) created as a partitioned table.
    # so, notwithstanding manual intervention or intermittent enabling,
    # disabling the partition manager means that no partitions exist to receive rows.
    enabled: true
    # the postgres schema containing our tables
    schema: public
    # daily|weekly|monthly|quarterly|yearly
    interval: monthly
    # number of partitions to retain, -1 to keep all
    retain: 3
    # whether to drop or simply detach
    drop: true
    # number of partitions to prepare ahead
    preProvision: 3

auth:
  jwtsecret: 'super secret string'
  # this is the JWT cookie domain
  domain: example.com
  # this allows the JWT cookie to be served over plain HTTP only for these Host: header values
  allowInsecureFor:
    "localhost": true
    "xenon": true
  # this instead changes the meaning of allowInsecureFor to the cookie being marked
  # Secure, but SameSite will be set to None
  sameSiteNoneForInsecure: false
  # only allow API key authenticated requests according to ACL
  # If this is totally unset, the default is deny
  apiKeyACL:
    allow:
      - 127.0.0.1
      - ::1
      - 192.168.3.4
      - 192.168.1.0/24
      - 2001:dead:beef::4/128
    deny:
      - 192.168.1.54
    # allow, deny means allow entries are evaluated first;
    # at least one must match, or the request is rejected. Next, all deny entries are evaluated.
    # If any match, the request is denied. Last, any requests which do not match an allow or a
    # deny entry are denied by default.
    # deny, allow means all deny entries are evaluated; if any match, the request is denied
    # unless it also matches an allow entry. Any requests which do not match any entries are permitted.
    # Use deny, allow with no list entries if you really want to allow any client to use API key auth.
    order: deny, allow

log:
  # level logs at or above the specifies level
  # levels are trace, debug, info, warn, error, fatal, panic
  # an entry without a file: property indicates stderr
  - level: debug
  - level: error
    file: error.log

alerting:
  enable: true
  lookbackDays: 7
  halfLife: 30m
  recent: 2h
  alertThreshold: 0.3
  renotify: 30m
  # if maxContext is >0, it specifies the number of transcripts to search for in alerts
  maxContext: 3
  # callLengthThreshold specifies the minimum call length to get transcripts for; default is 4 seconds
  callLengthThreshold: 4s
  # contextLookback specifies how far back to look for transcripts
  contextLookback: 20m

