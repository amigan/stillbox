metrics:
  # Enable prometheus metrics
  enabled: true
  # Metrics path, default /metrics
  path: /metrics
  # metrics endpoint basic auth. If either are empty or unset, auth is disabled.
  # username
  username: metrics
  # password
  password: changeme1234
  # ACL same as for API key ACL above
  acl:
    allow:
      - 127.0.0.1
      - ::1
      - 192.168.3.4
      - 192.168.1.0/24
      - 2001:dead:beef::4/128
    deny:
      - 192.168.1.54
